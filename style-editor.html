<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Vietnam Vector Map - Style Editor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .header {
            height: 64px;
            background: #ffffff;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 18px;
            margin: 0;
        }

        .container {
            display: grid;
            grid-template-columns: 360px 1fr;
            min-height: calc(100vh - 64px);
        }

        .sidebar {
            background: #fff;
            border-right: 1px solid #ddd;
            padding: 20px;
            overflow-y: auto;
        }

        .preview {
            padding: 20px;
        }

        .section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: #777;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: .5px;
        }

        .color-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid #eee;
        }

        .color-row label {
            flex: 1;
            font-size: 14px;
        }

        input[type="color"] {
            width: 42px;
            height: 32px;
            padding: 2px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
        }

        .hex {
            width: 92px;
            height: 32px;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 0 8px;
            font-family: monospace;
            font-size: 12px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 600;
        }

        .preset-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .preset-buttons button {
            background: #eee;
        }

        .primary {
            width: 100%;
            background: #2864f0;
            color: #fff;
            margin-top: 10px;
        }

        .secondary {
            width: 100%;
            background: #eee;
            margin-top: 8px;
        }

        .preview-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,.08);
        }

        #preview {
            height: calc(100vh - 150px);
            min-height: 500px;
            border-radius: 12px;
            overflow: hidden;
            background: #ddd;
        }

        .status {
            font-size: 12px;
            color: #777;
            margin-top: 10px;
        }

        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                border-right: 0;
                border-bottom: 1px solid #ddd;
            }

            #preview {
                height: 500px;
            }
        }
    </style>

<script>

const API = window.location.origin;

const DEFAULT_THEME = {

    background: "#F7F6F2",

    water: "#DCEFF0",
    waterLine: "#B9DDE0",

    building: "#E8E6E1",
    buildingOutline: "#D5D2CB",

    roadMinor: "#FFFFFF",
    roadResidential: "#FFFFFF",
    roadSecondary: "#FFFDF8",
    roadPrimary: "#FFF4C7",
    roadMotorway: "#FFE29A",

    bridge: "#FFFFFF",
    bridgeOutline: "#8F8B83",

    text: "#30302E",
    textSecondary: "#73716C",
    textHalo: "#FFFFFF",

    route: "#2864F0",
    routeOutline: "#FFFFFF",

    marker: "#2864F0",

    roadMinorOutline: "#D8D8D8",
    roadResidentialOutline: "#D8D8D8",
    roadSecondaryOutline: "#D0CEC7",
    roadPrimaryOutline: "#D5C98F",
    roadMotorwayOutline: "#C7AA62",
};


const PRESETS = {

    beeline: {
        ...DEFAULT_THEME
    },

    light: {
        background: "#F8F9FA",

        water: "#D9EEF7",
        waterLine: "#A8D6E8",

        building: "#E5E5E5",
        buildingOutline: "#CCCCCC",

        roadMinor: "#FFFFFF",
        roadResidential: "#FFFFFF",
        roadSecondary: "#FFFDF5",
        roadPrimary: "#FFE9A8",
        roadMotorway: "#FFD36A",

        bridge: "#FFFFFF",
        bridgeOutline: "#777777",

        text: "#333333",
        textSecondary: "#666666",
        textHalo: "#FFFFFF",

        route: "#2864F0",
        routeOutline: "#FFFFFF",

        marker: "#2864F0"
    },

    dark: {
        background: "#181818",

        water: "#203A40",
        waterLine: "#315B63",

        building: "#292929",
        buildingOutline: "#3A3A3A",

        roadMinor: "#303030",
        roadResidential: "#383838",
        roadSecondary: "#454545",
        roadPrimary: "#635322",
        roadMotorway: "#795B20",

        bridge: "#454545",
        bridgeOutline: "#999999",

        text: "#F5F5F5",
        textSecondary: "#B5B5B5",
        textHalo: "#181818",

        route: "#4D8DFF",
        routeOutline: "#181818",

        marker: "#4D8DFF"
    }

};


let theme = loadTheme();


function loadTheme() {

    try {

        const saved =
            localStorage.getItem("vietnam-map-theme");

        if (saved) {

            return {
                ...DEFAULT_THEME,
                ...JSON.parse(saved)
            };

        }

    } catch (e) {

        console.error(e);

    }

    return {
        ...DEFAULT_THEME
    };

}


function syncInputs() {

    document
        .querySelectorAll("[data-key]")
        .forEach(input => {

            const key = input.dataset.key;

            input.value =
                theme[key] || "#ffffff";

        });


    document
        .querySelectorAll("[data-hex]")
        .forEach(input => {

            const key = input.dataset.hex;

            input.value =
                theme[key] || "#ffffff";

        });

}


function updateTheme(key, value) {

    if (!/^#[0-9A-Fa-f]{6}$/.test(value)) {

        return;

    }

    theme[key] = value;

    syncInputs();

    updateMap();

    document.getElementById("status").innerText =
        "Đã thay đổi — chưa lưu";

}


document
    .querySelectorAll("[data-key]")
    .forEach(input => {

        input.addEventListener("input", () => {

            updateTheme(
                input.dataset.key,
                input.value
            );

        });

    });


document
    .querySelectorAll("[data-hex]")
    .forEach(input => {

        input.addEventListener("change", () => {

            updateTheme(
                input.dataset.hex,
                input.value
            );

        });

    });


function applyPreset(name) {

    theme = {
        ...DEFAULT_THEME,
        ...PRESETS[name]
    };

    syncInputs();

    updateMap();

    document.getElementById("status").innerText =
        "Preset " + name + " đã được áp dụng";

}


function saveTheme() {

    localStorage.setItem(
        "vietnam-map-theme",
        JSON.stringify(theme)
    );

    document.getElementById("status").innerText =
        "✓ Đã lưu theme";

}


function resetTheme() {

    localStorage.removeItem(
        "vietnam-map-theme"
    );

    theme = {
        ...DEFAULT_THEME
    };

    syncInputs();

    updateMap();

    document.getElementById("status").innerText =
        "Đã reset";

}


function exportTheme() {

    const blob = new Blob(
        [
            JSON.stringify(theme, null, 2)
        ],
        {
            type: "application/json"
        }
    );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "vietnam-map-theme.json";

    a.click();

    URL.revokeObjectURL(url);

}


const map = window.__styleEditorMap = new maplibregl.Map({

    container: "preview",

    center: [106.6297, 10.8231],

    zoom: 10,

    minZoom: 4,

    maxZoom: 22,

    attributionControl: true,

    style: {

        version: 8,

        glyphs:
            "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",

        sources: {

            highway: {

                type: "vector",

                tiles: [
                    API +
                    "/api/tiles/highway/{z}/{x}/{y}.pbf"
                ],

                minzoom: 4,
                maxzoom: 22

            },

            building: {

                type: "vector",

                tiles: [
                    API +
                    "/api/tiles/building/{z}/{x}/{y}.pbf"
                ],

                minzoom: 12,
                maxzoom: 16

            },

            water: {

                type: "vector",

                tiles: [
                    API +
                    "/api/tiles/water/{z}/{x}/{y}.pbf"
                ],

                minzoom: 5,
                maxzoom: 14

            },

            place: {

                type: "vector",

function updateMap() {

    if (!map.isStyleLoaded()) {
        return;
    }

    const changes = {

        "background":
            ["background-color", theme.background],

        "water-fill":
            ["fill-color", theme.water],

        "water-line":
            ["line-color", theme.waterLine],

        "building-fill":
            ["fill-color", theme.building],

        "building-outline":
            ["line-color", theme.buildingOutline],

        "bridge":
            ["line-color", theme.bridgeOutline],

        "place-label":
            ["text-color", theme.text],

        "road-label":
            ["text-color", theme.textSecondary]

    };


    Object.entries(changes)
        .forEach(([layer, [property, value]]) => {

            try {

                map.setPaintProperty(
                    layer,
                    property,
                    value
                );

            } catch (e) {

                console.warn(
                    "Cannot update",
                    layer,
                    e
                );

            }

        });


    try {

        map.setPaintProperty(
            "road",
            "line-color",
            [
                "match",

                ["get", "highway"],

                "motorway",
                theme.roadMotorway,

                "trunk",
                theme.roadMotorway,

                "primary",
                theme.roadPrimary,

                "secondary",
                theme.roadSecondary,

                "tertiary",
                theme.roadSecondary,

                "residential",
                theme.roadResidential,

                "service",
                theme.roadMinor,

                theme.roadMinor
            ]
        );

    } catch (e) {

        console.warn(e);

    }


        /*
        |--------------------------------------------------------------------------
        | ROUTE COLORS
        |--------------------------------------------------------------------------
        */

        try {

            if (map.getLayer("route-outline")) {

                map.setPaintProperty(
                    "route-outline",
                    "line-color",
                    theme.routeOutline
                );

            }

        } catch (e) {

            console.warn(
                "Cannot update route-outline",
                e
            );

        }

        try {

            if (map.getLayer("route")) {

                map.setPaintProperty(
                    "route",
                    "line-color",
                    theme.route
                );

            }

        } catch (e) {

            console.warn(
                "Cannot update route",
                e
            );

        }




    /*
    |--------------------------------------------------------------------------
    | ROAD OUTLINE COLORS
    |--------------------------------------------------------------------------
    | Update the actual outline layers.
    |
    | These are separate MapLibre layers from "road".
    |--------------------------------------------------------------------------
    */

    const roadOutlineColors = {
        "road-motorway-outline": theme.roadMotorwayOutline,
        "road-primary-outline": theme.roadPrimaryOutline,
        "road-secondary-outline": theme.roadSecondaryOutline,
        "road-residential-outline": theme.roadResidentialOutline,
        "road-minor-outline": theme.roadMinorOutline
    };

    /*
     * CAP NHAT MAU OUTLINE
     *
     * QUAN TRONG:
     * outline la layer rieng nam ben duoi layer "road".
     *
     * Khi user doi mau outline, phai cap nhat
     * line-color truc tiep tren layer MapLibre.
     *
     * KHONG set line-width tai day.
     * line-width phai giu expression theo zoom
     * da khai bao trong layer definition.
     */

    Object.entries(roadOutlineColors).forEach(
        ([layerId, color]) => {
            try {
                if (!map.getLayer(layerId)) {
                    console.warn(
                        "Khong tim thay outline layer:",
                        layerId
                    );
                    return;
                }

                map.setPaintProperty(
                    layerId,
                    "line-color",
                    color
                );

            } catch (e) {
                console.error(
                    "Khong the cap nhat mau outline:",
                    layerId,
                    color,
                    e
                );
            }
        }
    );

}

<script id="vietnam-vector-poi-editor-js">
/* VIETNAM_VECTOR_POI_ICON_UI_V1 */

(function () {

    "use strict";

    async function loadPOIIcons() {

        const container =
            document.getElementById(
                "vietnam-poi-editor-icons"
            );

        if (!container) return;

        const status =
            container.querySelector(
                ".vietnam-poi-editor-icons-status"
            );

        const grid =
            container.querySelector(
                ".vietnam-poi-editor-icons-grid"
            );

        const search =
            container.querySelector(
                ".vietnam-poi-editor-icons-search"
            );

        try {

            const response =
                await fetch(
                    "/api/icons",
                    { cache: "no-store" }
                );

            if (!response.ok) {
                throw new Error(
                    "HTTP " + response.status
                );
            }

            const data =
                await response.json();

            let icons =
                Array.from(
                    new Set(
                        Object.values(
                            data.icons || {}
                        )
                    )
                )
                .filter(Boolean)
                .sort();

            status.textContent =
                "Loaded " +
                icons.length +
                " icons";

            function draw(list) {

                grid.innerHTML = "";

                list.forEach(function (name) {

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.type = "button";
                    button.className =
                        "vietnam-poi-editor-icon";

                    button.innerHTML = `
                        <img
                            src="/icons/${encodeURIComponent(name)}.svg"
                            alt="${name}"
                        >
                        <span>${name}</span>
                    `;

                    button.onclick = function () {

                        window.dispatchEvent(
                            new CustomEvent(
                                "vietnam-poi-icon-selected",
                                {
                                    detail: {
                                        icon: name,
                                        url:
                                            "/icons/" +
                                            name +
                                            ".svg"
                                    }
                                }
                            )
                        );

                        console.log(
                            "[Vietnam Vector] editor icon:",
                            name
                        );
                    };

                    grid.appendChild(button);
                });
            }

            draw(icons);

            search.addEventListener(
                "input",
                function () {

                    const q =
                        this.value
                            .trim()
                            .toLowerCase();

                    draw(
                        q
                            ? icons.filter(
                                x =>
                                    x.toLowerCase()
                                     .includes(q)
                              )
                            : icons
                    );
                }
            );

        } catch (error) {

            status.textContent =
                "Icon API error: " +
                error.message;
        }
    }

    function init() {

        if (
            document.getElementById(
                "vietnam-poi-editor-icons"
            )
        ) {
            return;
        }

        const box =
            document.createElement("div");

        box.id =
            "vietnam-poi-editor-icons";

        box.className =
            "vietnam-poi-editor-icons";

        box.innerHTML = `
            <div class="vietnam-poi-editor-icons-title">
                POI Icons
            </div>

            <div
                class="vietnam-poi-editor-icons-status"
            >
                Loading...
            </div>

            <input
                class="vietnam-poi-editor-icons-search"
                placeholder="Search POI icon..."
            >

            <div
                class="vietnam-poi-editor-icons-grid"
            ></div>
        `;

        document.body.appendChild(box);

        loadPOIIcons();
    }

    window.VietnamVectorStyleEditorIcons = {
        init: init
    };

    if (
        document.readyState === "loading"
    ) {
        document.addEventListener(
            "DOMContentLoaded",
            init
        );
    } else {
        init();
    }

})();
</script>

        return String(value || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .replace(/đ/g, "d")
            .replace(/[^a-z0-9\s]/g, " ")
            .replace(/\s+/g, " ")
            .trim();

    }

                "vietnam-location-search-results"
            );

        const container =
            document.getElementById(
                "vietnam-location-search"
            );

        if (!input || !clearButton || !results || !container) {

            console.error(
                "VIETNAM LOCATION SEARCH: DOM NOT FOUND"
            );

            return;

        }

        let activeIndex = -1;

        function hideResults() {

            results.innerHTML = "";
            results.style.display = "none";
            activeIndex = -1;

        }

        function showResults() {

            const query = normalize(input.value);

            results.innerHTML = "";
            activeIndex = -1;

            if (!query) {

                hideResults();
                return;

            }

            const matches = locations.filter(function (item) {

                const values = [
                    item.name,
                    item.detail,
                    ...(item.aliases || [])
                ];

                return values.some(function (value) {

                    return normalize(value).includes(query);

                });

            });

            if (!matches.length) {

                const empty =
                    document.createElement("div");

                empty.className =
                    "vietnam-location-search-empty";

                empty.textContent =
                    "Không tìm thấy địa điểm";

                results.appendChild(empty);

                results.style.display = "block";

                return;

            }

            matches.forEach(function (item, index) {

                const row =
                    document.createElement("div");

                row.className =
                    "vietnam-location-search-result";

                row.dataset.index = String(index);

                row.innerHTML =

                    '<div class="vietnam-location-search-result-icon">' +
                        item.icon +
                    '</div>' +

                    '<div class="vietnam-location-search-result-content">' +

                        '<div class="vietnam-location-search-result-name">' +
                            item.name +
                        '</div>' +

                        '<div class="vietnam-location-search-result-detail">' +
                            item.detail +
                        '</div>' +

                    '</div>';

                row.addEventListener("mousedown", function (event) {

                    event.preventDefault();

                });

                row.addEventListener("click", function () {

                    selectLocation(item);

                });

                results.appendChild(row);

            });

            results.style.display = "block";

        }

        function selectLocation(item) {

            if (
                typeof map === "undefined" ||
                !map ||
                typeof map.flyTo !== "function"
            ) {

                console.error(
                    "VIETNAM LOCATION SEARCH: map is not available"
                );

                return;

            }

            map.flyTo({

                center: item.center,

                zoom: item.zoom,

                speed: 1.2,

                curve: 1.4,

                essential: true

            });

            input.value = item.name;

            clearButton.style.display = "block";

            hideResults();

            if (typeof updateStatus === "function") {

                try {

                    updateStatus(
                        "Đã chọn: " + item.name
                    );

                } catch (e) {}

            }

            console.log(
                "LOCATION SEARCH: selected",
                item.name,
                item.center
            );

        }

        function moveActive(direction) {

            const rows =
                Array.from(
                    results.querySelectorAll(
                        ".vietnam-location-search-result"
                    )
                );

            if (!rows.length) {
                return;
            }

            activeIndex += direction;

            if (activeIndex < 0) {
                activeIndex = rows.length - 1;
            }

            if (activeIndex >= rows.length) {
                activeIndex = 0;
            }

            rows.forEach(function (row, index) {

                row.classList.toggle(
                    "active",
                    index === activeIndex
                );

            });

        }

        input.addEventListener("input", function () {

            clearButton.style.display =
                input.value.trim()
                    ? "block"
                    : "none";

            showResults();

        });

        input.addEventListener("focus", function () {

            if (input.value.trim()) {

                showResults();

            }

        });

        input.addEventListener("keydown", function (event) {

            if (event.key === "ArrowDown") {

                event.preventDefault();

                moveActive(1);

                return;

            }

            if (event.key === "ArrowUp") {

                event.preventDefault();

                moveActive(-1);

                return;

            }

            if (event.key === "Enter") {

                event.preventDefault();

                const rows =
                    Array.from(
                        results.querySelectorAll(
                            ".vietnam-location-search-result"
                        )
                    );

                if (
                    activeIndex >= 0 &&
                    rows[activeIndex]
                ) {

                    rows[activeIndex].click();
                    return;

                }

                const query =
                    normalize(input.value);

                const match =
                    locations.find(function (item) {

                        const values = [
                            item.name,
                            item.detail,
                            ...(item.aliases || [])
                        ];

                        return values.some(function (value) {

                            return normalize(value) === query;

                        });

                    });

                if (match) {

                    selectLocation(match);

                } else {

                    showResults();

                }

                return;

            }

            if (event.key === "Escape") {

                hideResults();

            }

        });

        clearButton.addEventListener("click", function () {

            input.value = "";

            clearButton.style.display = "none";

            hideResults();

            input.focus();

        });

        document.addEventListener("click", function (event) {

            if (!container.contains(event.target)) {

                hideResults();

            }

        });

        console.log(
            "VIETNAM LOCATION SEARCH: READY"
        );

    }

    if (document.readyState === "loading") {

        document.addEventListener(
            "DOMContentLoaded",
            init
        );

    } else {

        init();

    }

})();
</script>



<script>
/* ============================================================
   AUTO COLOR OUTLINE
   Mỗi input[type=color] sẽ có outline bằng chính màu của nó.
   Tự cập nhật ngay khi người dùng đổi màu.
   ============================================================ */

(function () {
    "use strict";

    function updateColorOutline(input) {
        if (!input || input.type !== "color") return;

        let color = input.value;

        if (!color || !/^#[0-9a-fA-F]{6}$/.test(color)) {
            color = "#000000";
        }

        input.classList.add("color-outline-auto");
        input.style.setProperty("--color-outline", color);
    }

    function updateAllColorInputs(root) {
        const scope = root || document;

        scope.querySelectorAll('input[type="color"]').forEach(function (input) {
            updateColorOutline(input);

            if (!input.dataset.colorOutlineBound) {
                input.addEventListener("input", function () {
                    updateColorOutline(input);
                });

                input.addEventListener("change", function () {
                    updateColorOutline(input);
                });

                input.dataset.colorOutlineBound = "1";
            }
        });
    }

    /* Initial */
    function initColorOutlines() {
        updateAllColorInputs(document);
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initColorOutlines);
    } else {
        initColorOutlines();
    }

    /*
     * Bắt các color input được tạo động bởi editor.
     */
    const observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
            mutation.addedNodes.forEach(function (node) {
                if (node.nodeType !== 1) return;

                if (node.matches && node.matches('input[type="color"]')) {
                    updateAllColorInputs(node.parentElement || node);
                } else if (node.querySelectorAll) {
                    updateAllColorInputs(node);
                }
            });
        });
    });

    observer.observe(document.documentElement, {
        childList: true,
        subtree: true
    });

    /*
     * Một số editor thay đổi value bằng JavaScript.
     * Kiểm tra định kỳ nhẹ để outline luôn đồng bộ.
     */
    setInterval(function () {
        updateAllColorInputs(document);
    }, 500);

})();
</script>

        <b id="rw-final-current-layer">Road</b>

        <button id="rw-final-apply">Áp dụng preview</button>
        <button id="rw-final-reset">Reset</button>
    </div>

<script>
(function () {
    "use strict";

    const LAYERS = {
        "road": {
            label: "Road",
            outline: false
        },

        "road-motorway-outline": {
            label: "Motorway outline",
            outline: true
        },

        "road-primary-outline": {
            label: "Primary outline",
            outline: true
        },

        "road-secondary-outline": {
            label: "Secondary outline",
            outline: true
        },

        "road-residential-outline": {
            label: "Residential outline",
            outline: true
        },

        "road-minor-outline": {
            label: "Minor outline",
            outline: true
        }
    };

    const OUTLINES = [
        "road-motorway-outline",
        "road-primary-outline",
        "road-secondary-outline",
        "road-residential-outline",
        "road-minor-outline"
    ];

    let originalWidths = {};
    let originalOrder = [];
    let ready = false;

    const panel = document.getElementById(
        "road-width-preview-final"
    );

    const layerSelect = document.getElementById(
        "rw-final-layer"
    );

    const zoomSlider = document.getElementById(
        "rw-final-zoom"
    );

    const zoomLabel = document.getElementById(
        "rw-final-zoom-label"
    );

    const widthInput = document.getElementById(
        "rw-final-width"
    );

    const widthSlider = document.getElementById(
        "rw-final-width-slider"
    );

    const currentZoom = document.getElementById(
        "rw-final-current-zoom"
    );

    const currentWidth = document.getElementById(
        "rw-final-current-width"
    );

    const currentLayer = document.getElementById(
        "rw-final-current-layer"
    );

    function getMap() {
        return window.__styleEditorMap ||
            window.map ||
            null;
    }

    function evaluateWidth(expression, zoom) {
        if (typeof expression === "number") {
            return expression;
        }

        if (!Array.isArray(expression)) {
            return null;
        }

        if (
            expression[0] !== "interpolate" ||
            !Array.isArray(expression[1]) ||
            expression[1][0] !== "linear"
        ) {
            return null;
        }

        const stops = expression.slice(3);

        if (stops.length < 2) {
            return null;
        }

        for (let i = 0; i <= stops.length - 4; i += 2) {
            const z1 = Number(stops[i]);
            const w1 = Number(stops[i + 1]);
            const z2 = Number(stops[i + 2]);
            const w2 = Number(stops[i + 3]);

            if (
                Number.isFinite(z1) &&
                Number.isFinite(w1) &&
                Number.isFinite(z2) &&
                Number.isFinite(w2) &&
                zoom >= z1 &&
                zoom <= z2
            ) {
                if (z2 === z1) {
                    return w2;
                }

                const t = (zoom - z1) / (z2 - z1);

                return w1 + (w2 - w1) * t;
            }
        }

        if (zoom <= Number(stops[0])) {
            return Number(stops[1]);
        }

        return Number(stops[stops.length - 1]);
    }

    function captureOriginal() {
        const m = getMap();

        if (!m) {
            return false;
        }

        const style = m.getStyle();

        if (
            style &&
            Array.isArray(style.layers) &&
            originalOrder.length === 0
        ) {
            originalOrder = style.layers.map(
                layer => layer.id
            );
        }

        for (const id of Object.keys(LAYERS)) {
            if (!m.getLayer(id)) {
                continue;
            }

            if (originalWidths[id] === undefined) {
                try {
                    originalWidths[id] =
                        m.getPaintProperty(
                            id,
                            "line-width"
                        );
                } catch (e) {
                    console.warn(
                        "Không đọc được width:",
                        id,
                        e
                    );
                }
            }
        }

        return true;
    }

    function restoreOrder() {
        const m = getMap();

        if (!m || !originalOrder.length) {
            return;
        }

        /*
         * Restore toàn bộ thứ tự layer ban đầu.
         * moveLayer(id, beforeId) được chạy từ cuối -> đầu
         * để đưa style về đúng thứ tự ban đầu.
         */
        for (
            let i = originalOrder.length - 1;
            i >= 0;
            i--
        ) {
            const id = originalOrder[i];

            if (!m.getLayer(id)) {
                continue;
            }

            const beforeId =
                originalOrder[i + 1];

            try {
                if (
                    beforeId &&
                    m.getLayer(beforeId)
                ) {
                    m.moveLayer(id, beforeId);
                } else {
                    m.moveLayer(id);
                }
            } catch (e) {}
        }
    }

    function makeOutlinesVisible() {
        const m = getMap();

        if (!m || !m.getLayer("road")) {
            return;
        }

        /*
         * Outline nằm dưới road trong style gốc.
         * Không thay đổi expression gốc.
         *
         * Khi preview outline:
         *   outline được đưa lên trên road
         * để người dùng luôn nhìn thấy width đang chỉnh.
         */
        for (const id of OUTLINES) {
            if (!m.getLayer(id)) {
                continue;
            }

            try {
                m.moveLayer(id);
            } catch (e) {}
        }
    }

    function getCurrentWidth() {
        const m = getMap();

        if (!m) {
            return null;
        }

        const id = layerSelect.value;
        const z = Number(zoomSlider.value);

        try {
            const expression =
                originalWidths[id] !== undefined
                    ? originalWidths[id]
                    : m.getPaintProperty(
                        id,
                        "line-width"
                    );

            return evaluateWidth(
                expression,
                z
            );
        } catch (e) {
            return null;
        }
    }

    function updateUI() {
        const z = Number(
            zoomSlider.value
        );

        const w = Number(
            widthInput.value
        );

        const id =
            layerSelect.value;

        zoomLabel.textContent =
            "Z" + z;

        currentZoom.textContent =
            "Z" + z;

        currentWidth.textContent =
            Number.isFinite(w)
                ? w.toFixed(2) + " px"
                : "0.00 px";

        currentLayer.textContent =
            LAYERS[id]
                ? LAYERS[id].label
                : id;
    }

    function loadOriginalWidthForZoom() {
        captureOriginal();

        const w =
            getCurrentWidth();

        if (
            w !== null &&
            Number.isFinite(w)
        ) {
            widthInput.value =
                w.toFixed(2);

            widthSlider.value =
                String(
                    Math.max(
                        0,
                        Math.min(
                            30,
                            w
                        )
                    )
                );
        }

        updateUI();
    }

    function setPreviewWidth() {
        const m = getMap();

        if (!m) {
            return;
        }

        const id =
            layerSelect.value;

        let width =
            Number(widthInput.value);

        if (!Number.isFinite(width)) {
            width = 0;
        }

        width =
            Math.max(
                0,
                Math.min(
                    30,
                    width
                )
            );

        widthInput.value =
            width.toFixed(2);

        widthSlider.value =
            String(width);

        try {
            /*
             * Chỉ thay đổi runtime paint property.
             * Expression gốc vẫn nằm trong originalWidths.
             */
            m.setPaintProperty(
                id,
                "line-width",
                width
            );

            /*
             * Đưa outline lên trên road trong preview
             * để width đang chỉnh luôn nhìn thấy.
             */
            if (LAYERS[id].outline) {
                makeOutlinesVisible();
            }

            updateUI();

            console.log(
                "[Road Width Preview]",
                id,
                "Z" + zoomSlider.value,
                width + "px"
            );
        } catch (e) {
            console.error(
                "Không áp dụng width preview:",
                id,
                e
            );
        }
    }

    function resetPreview() {
        const m = getMap();

        if (!m) {
            return;
        }

        captureOriginal();

        /*
         * Khôi phục expression width gốc.
         */
        for (
            const [id, expression]
            of Object.entries(
                originalWidths
            )
        ) {
            if (!m.getLayer(id)) {
                continue;
            }

            try {
                m.setPaintProperty(
                    id,
                    "line-width",
                    expression
                );
            } catch (e) {}
        }

        /*
         * Khôi phục thứ tự layer gốc.
         */
        restoreOrder();

        loadOriginalWidthForZoom();

        console.log(
            "[Road Width Preview] RESET"
        );
    }

    function setZoom() {
        const m = getMap();

        const z = Number(
            zoomSlider.value
        );

        if (m) {
            try {
                m.setZoom(z);
            } catch (e) {}
        }

        /*
         * Không thay đổi expression.
         * Chỉ đọc width gốc tại zoom mới.
         */
        loadOriginalWidthForZoom();

        /*
         * Nếu đang chọn outline,
         * giữ outline visible.
         */
        if (
            LAYERS[
                layerSelect.value
            ].outline
        ) {
            makeOutlinesVisible();
        }
    }

    function onLayerChange() {
        /*
         * Reset runtime width của layer trước
         * expression gốc trước khi đổi layer.
         */
        resetPreview();

        loadOriginalWidthForZoom();

        if (
            LAYERS[
                layerSelect.value
            ].outline
        ) {
            makeOutlinesVisible();
        }
    }

    function syncSlider() {
        widthInput.value =
            Number(
                widthSlider.value
            ).toFixed(2);

        updateUI();
    }

    function syncInput() {
        let w =
            Number(
                widthInput.value
            );

        if (!Number.isFinite(w)) {
            w = 0;
        }

        w =
            Math.max(
                0,
                Math.min(
                    30,
                    w
                )
            );

        widthInput.value =
            w.toFixed(2);

        widthSlider.value =
            String(w);

        updateUI();
    }

    function init() {
        const m = getMap();

        if (!m) {
            setTimeout(init, 300);
            return;
        }

        if (!captureOriginal()) {
            setTimeout(init, 300);
            return;
        }

        if (ready) {
            return;
        }

        ready = true;

        /*
         * Bắt đầu ở Z10.
         */
        try {
            m.setZoom(
                Number(
                    zoomSlider.value
                )
            );
        } catch (e) {}

        loadOriginalWidthForZoom();

        zoomSlider.addEventListener(
            "input",
            setZoom
        );

        widthSlider.addEventListener(
            "input",
            syncSlider
        );

        widthInput.addEventListener(
            "input",
            syncInput
        );

        layerSelect.addEventListener(
            "change",
            onLayerChange
        );

        document.getElementById(
            "rw-final-apply"
        ).addEventListener(
            "click",
            setPreviewWidth
        );

        document.getElementById(
            "rw-final-reset"
        ).addEventListener(
            "click",
            resetPreview
        );

        updateUI();

        console.log(
            "[Road Width Preview FINAL] READY",
            Object.keys(LAYERS)
        );
    }

    if (
        document.readyState ===
        "loading"
    ) {
        document.addEventListener(
            "DOMContentLoaded",
            init
        );
    } else {
        init();
    }
})();
</script>
