<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<script>

const API = window.VIETNAM_VECTOR_API || window.location.origin;

const VIETNAM = [
    106.6297,
    10.8231
];


/*
|--------------------------------------------------------------------------
| MAP
|--------------------------------------------------------------------------
*/

/*
|--------------------------------------------------------------------------
| VIETNAM VECTOR MAP THEME
|--------------------------------------------------------------------------
*/
const MAP_THEME = {
    background: "#F7F6F2",
    water: "#DCEFF0",
    waterLine: "#B9DDE0",
    building: "#E8E6E1",
    buildingOutline: "#D5D2CB",

    roadMinor: "#FFFFFF",
    roadMinorOutline: "#D8D8D8",

    roadResidential: "#FFFFFF",
    roadResidentialOutline: "#D8D8D8",

    roadSecondary: "#FFFDF8",
    roadSecondaryOutline: "#D0CEC7",

    roadPrimary: "#FFF4C7",
    roadPrimaryOutline: "#D5C98F",

    roadMotorway: "#FFE29A",
    roadMotorwayOutline: "#C7AA62",

    bridge: "#FFFFFF",
    bridgeOutline: "#8F8B83",

    text: "#30302E",
    textSecondary: "#73716C",
    textHalo: "#FFFFFF",

    route: "#2864F0",
    routeOutline: "#FFFFFF",
    marker: "#2864F0"
};



const map = new maplibregl.Map({

    container: "map",

    center: VIETNAM,

    zoom: 6,

    minZoom: 4,

    maxZoom: 18,

    attributionControl: true,

    style: {

        version: 8,

        glyphs:
            "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",

        sources: {

            /*
            |--------------------------------------------------------------------------
            | HIGHWAY
            |--------------------------------------------------------------------------
            */

            highway: {

                type: "vector",

                tiles: [
                    API +
                    "/api/tiles/highway/{z}/{x}/{y}.pbf"
                ],

                minzoom: 4,

                maxzoom: 14

            },


            /*
            |--------------------------------------------------------------------------
            | BUILDING
            |--------------------------------------------------------------------------
            */

            building: {

                type: "vector",

                tiles: [
                    API +
                    "/api/tiles/building/{z}/{x}/{y}.pbf"
                ],

                minzoom: 12,

                maxzoom: 16

            },


            /*
            |--------------------------------------------------------------------------
            | WATER
            |--------------------------------------------------------------------------
            */

            water: {

                type: "vector",

                tiles: [
                    API +
                    "/api/tiles/water/{z}/{x}/{y}.pbf"
                ],

                minzoom: 5,

                maxzoom: 14

            },


            /*
            |--------------------------------------------------------------------------
            | PLACE
            |--------------------------------------------------------------------------
            */

            place: {

                type: "vector",

                tiles: [
                    API +
                    "/api/tiles/place/{z}/{x}/{y}.pbf"
                ],

                minzoom: 4,

                maxzoom: 14

            },


            /*
            |--------------------------------------------------------------------------
            | BRIDGE
            |--------------------------------------------------------------------------
            */

            bridge: {

                type: "vector",

                tiles: [
                    API +
                    "/api/tiles/bridge/{z}/{x}/{y}.pbf"
                ],

                minzoom: 8,

                maxzoom: 16

            }

        },

            poi: {
                type: "vector",
                tiles: [
                    API +
                    "/api/tiles/poi/{z}/{x}/{y}.pbf"
                ],
                minzoom: 11,
                maxzoom: 20
            },

        layers: [
            /*
            |--------------------------------------------------------------------------
            | BACKGROUND
            |--------------------------------------------------------------------------
            */

            {
                id: "background",

                type: "background",

                paint: {
                    "background-color": "#f7f5f2"
                }
            },


            /*
            |--------------------------------------------------------------------------
            | WATER
            |--------------------------------------------------------------------------
            */

            {
                id: "water-fill",

                type: "fill",

                source: "water",

                "source-layer": "water",

                minzoom: 5,

                paint: {
                    "fill-color": "#9bd3f2",
                    "fill-opacity": 0.8
                }
            },


            /*
            |--------------------------------------------------------------------------
            | WATER LINE
            |--------------------------------------------------------------------------
            */

            {
                id: "water-line",

                type: "line",

                source: "water",

                "source-layer": "water",

                minzoom: 7,

                paint: {
                    "line-color": "#6bbce8",
                    "line-width": 1
                }
            },


            /*
            |--------------------------------------------------------------------------
            | BUILDINGS
            |--------------------------------------------------------------------------
            */

            {
                id: "building-fill",

                type: "fill",

                source: "building",

                "source-layer": "building",

                minzoom: 12,

                paint: {

                    "fill-color": "#d8c9b8",

                    "fill-opacity": [
                        "interpolate",
                        ["linear"],
                        ["zoom"],

                        12, 0.25,

                        15, 0.65,

                        18, 0.9
                    ]
                }
            },


            /*
            |--------------------------------------------------------------------------
            | BUILDING OUTLINE
            |--------------------------------------------------------------------------
            */

            {
                id: "building-outline",

                type: "line",

                source: "building",

                "source-layer": "building",

                minzoom: 13,

                paint: {

                    "line-color": "#a99783",

                    "line-width": [
                        "interpolate",
                        ["linear"],
                        ["zoom"],

                        13, 0.3,

                        16, 0.8
                    ],

                    "line-opacity": 0.6
                }
            },


            
            /*
            |--------------------------------------------------------------------------
            | ROADS - MOTORWAY OUTLINE
            |--------------------------------------------------------------------------
            */

            {
                id: "road-motorway-outline",
                type: "line",
                source: "highway",
                "source-layer": "highway",
                minzoom: 4,
                layout: {
                    "line-cap": "round",
                    "line-join": "round"
                },
                filter: [
                    "match",
                    ["get", "highway"],
                    ["motorway", "motorway_link"],
                    true,
                    false
                ],
                paint: {
                    "line-color": MAP_THEME.roadMotorwayOutline,
                    "line-width": [
                        "interpolate",
                        ["linear"],
                        ["zoom"],
                        4, 2.0,
                        8, 3.0,
                        10, 4.0,
                        12, 5.5,
                        14, 7.0,
                        16, 9.0,
                        18, 13
                    ],
                    "line-opacity": 1
                }
            },

            {
                id: "road-motorway",
                type: "line",
                source: "highway",
                "source-layer": "highway",
                minzoom: 4,
                layout: {
                    "line-cap": "round",
                    "line-join": "round"
                },
                filter: [
                    "match",
                    ["get", "highway"],
                    ["motorway", "motorway_link"],
                    true,
                    false
                ],
                paint: {
                    "line-color": MAP_THEME.roadMotorway,
                    "line-width": [
                        "interpolate",
                        ["linear"],
                        ["zoom"],
                        4, 1.0,
                        8, 1.5,
                        10, 2.0,
                        12, 3.0,
                        14, 4.5,
                        16, 6.5,
                        18, 10
                    ],
                    "line-opacity": 1
                }
            },

            /*
            |--------------------------------------------------------------------------
            | ROADS - PRIMARY OUTLINE
            |--------------------------------------------------------------------------
            */

            {
                id: "road-primary-outline",
                type: "line",
                source: "highway",
                "source-layer": "highway",
                minzoom: 4,
                layout: {
                    "line-cap": "round",
                    "line-join": "round"
                },
                filter: [
                    "match",
                    ["get", "highway"],
                    ["primary", "primary_link"],
                    true,
                    false
                ],
                paint: {
                    "line-color": MAP_THEME.roadPrimaryOutline,
                    "line-width": [
                        "interpolate",
                        ["linear"],
                        ["zoom"],
                        4, 1.7,
                        8, 2.5,
                        10, 3.2,
                        12, 4.2,
                        14, 5.8,
                        16, 7.5,
                        18, 11
                    ],
                    "line-opacity": 1
                }
            },

            {
                id: "road-primary",
                type: "line",
                source: "highway",
                "source-layer": "highway",
                minzoom: 4,
                layout: {
                    "line-cap": "round",
                    "line-join": "round"
                },
                filter: [
                    "match",
                    ["get", "highway"],
                    ["primary", "primary_link"],
                    true,
                    false
                ],
                paint: {
                    "line-color": MAP_THEME.roadPrimary,
                    "line-width": [
                        "interpolate",
                        ["linear"],
                        ["zoom"],
                        4, 0.8,
                        8, 1.3,
                        10, 1.7,
                        12, 2.5,
                        14, 3.8,
                        16, 5.5,
                        18, 8.5
                    ],
                    "line-opacity": 1
                }
            },

            /*
            |--------------------------------------------------------------------------
            | ROADS - SECONDARY OUTLINE
            |--------------------------------------------------------------------------
            */

            {
                id: "road-secondary-outline",
                type: "line",
                source: "highway",
                "source-layer": "highway",
                minzoom: 4,
                layout: {
                    "line-cap": "round",
                    "line-join": "round"
                },
                filter: [
                    "match",
                    ["get", "highway"],
                    ["secondary", "secondary_link"],
                    true,
                    false
                ],
                paint: {
                    "line-color": MAP_THEME.roadSecondaryOutline,
                    "line-width": [
                        "interpolate",
                        ["linear"],
                        ["zoom"],
                        4, 1.5,
                        8, 2.2,
                        10, 2.8,
                        12, 3.7,
                        14, 5.0,
                        16, 6.5,
                        18, 10
                    ],
                    "line-opacity": 1
                }
            },

            {
                id: "road-secondary",
                type: "line",
                source: "highway",
                "source-layer": "highway",

// Live navigation and off-route recovery.
(function setupNavigation() {
    const destinationInput = document.getElementById("route-destination");
    const status = document.getElementById("route-status");
    const startButton = document.getElementById("route-start");
    const stopButton = document.getElementById("route-stop");
    let watchId = null;
    let destination = "";
    let activeRoute = [];
    let offRouteFixes = 0;
    let lastRerouteAt = 0;
    let rerouting = false;
    let positionMarker = null;

    function setStatus(message) { status.textContent = message; }

    function pointSegmentDistanceMeters(point, a, b) {
        const lat0 = point[1] * Math.PI / 180;
        const scaleX = 111320 * Math.cos(lat0);
        const scaleY = 110540;
        const px = (point[0] - a[0]) * scaleX;
        const py = (point[1] - a[1]) * scaleY;
        const bx = (b[0] - a[0]) * scaleX;
        const by = (b[1] - a[1]) * scaleY;
        const denom = bx * bx + by * by;
        const t = denom ? Math.max(0, Math.min(1, (px * bx + py * by) / denom)) : 0;
        return Math.hypot(px - t * bx, py - t * by);
    }

    function distanceFromRoute(point) {
        let nearest = Infinity;
        for (let i = 1; i < activeRoute.length; i++) {
            nearest = Math.min(nearest, pointSegmentDistanceMeters(point, activeRoute[i - 1], activeRoute[i]));
        }
        return nearest;
    }

    async function requestRoute(point, isReroute = false) {
        if (rerouting) return;
        rerouting = true;
        if (isReroute) setStatus("Bạn đã lệch tuyến. Đang tìm đường mới...");
        try {
            const params = new URLSearchParams({
                origin: `${point[0]},${point[1]}`,
                destination,
                mode: document.getElementById("route-mode").value,
            });
            const response = await fetch(`${API}/directions?${params}`);
            const data = await response.json();
            if (!response.ok || !Array.isArray(data.coordinates) || data.coordinates.length < 2) {
                throw new Error(data.error || "Không tìm được tuyến đường.");
            }
            activeRoute = data.coordinates;
            window.setVietnamRoute({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: activeRoute } });
            if (isReroute) setStatus(`Đã cập nhật tuyến mới · ${data.distance_km} · ${data.duration_text}`);
            else setStatus(`Đã tìm thấy tuyến · ${data.distance_km} · ${data.duration_text}. Đang theo dõi vị trí.`);
            offRouteFixes = 0;
        } catch (error) {
            setStatus(error.message || "Lỗi khi tìm tuyến đường.");
        } finally {
            rerouting = false;
        }
    }

    function onPosition(position) {
        const point = [position.coords.longitude, position.coords.latitude];
        if (!positionMarker) {
            positionMarker = new maplibregl.Marker({ color: "#1769ff" }).setLngLat(point).addTo(map);
        } else positionMarker.setLngLat(point);

        if (!activeRoute.length) return;
        const deviation = distanceFromRoute(point);
        const threshold = Math.max(50, Math.min(100, (position.coords.accuracy || 0) + 25));
        if (deviation > threshold) offRouteFixes++;
        else offRouteFixes = 0;

        if (offRouteFixes >= 2 && Date.now() - lastRerouteAt > 10000 && !rerouting) {
            lastRerouteAt = Date.now();
            requestRoute(point, true);
        }
    }

    function stopNavigation(message = "Đã dừng dẫn đường.") {
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        watchId = null;
        activeRoute = [];
        offRouteFixes = 0;
        if (positionMarker) { positionMarker.remove(); positionMarker = null; }
        window.clearVietnamRoute();
        setStatus(message);
    }

    startButton.addEventListener("click", () => {
        destination = destinationInput.value.trim();
        if (!destination) { setStatus("Hãy nhập điểm đến trước."); destinationInput.focus(); return; }
        if (!navigator.geolocation) { setStatus("Trình duyệt không hỗ trợ định vị GPS."); return; }
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        watchId = null;
        activeRoute = [];
        setStatus("Đang lấy vị trí hiện tại...");
        navigator.geolocation.getCurrentPosition((position) => {
            onPosition(position);
            requestRoute([position.coords.longitude, position.coords.latitude]);
            if (watchId === null) {
                watchId = navigator.geolocation.watchPosition(onPosition, (error) => {
                    setStatus(`Không cập nhật được GPS: ${error.message}`);
                }, { enableHighAccuracy: true, maximumAge: 3000, timeout: 15000 });
            }
        }, (error) => setStatus(`Không lấy được vị trí: ${error.message}. Hãy cấp quyền vị trí và dùng HTTPS.`),
        { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
    });
    stopButton.addEventListener("click", () => stopNavigation());
})();

}


/*
|--------------------------------------------------------------------------
| TOGGLE LAYER GROUP
|--------------------------------------------------------------------------
*/

function toggleLayerGroup(group, visible) {

    const visibility =
        visible ? "visible" : "none";


    let ids = [];


    if (group === "roads") {

        ids = [
            "road-minor",
            "road-secondary",
            "road-primary",
            "road-motorway",
            "road-label"
        ];

    }


    if (group === "buildings") {

        ids = [
            "building-fill",
            "building-outline"
        ];

    }


    if (group === "water") {

        ids = [
            "water-fill",
            "water-line"
        ];

    }


    if (group === "places") {

        ids = [
            "place-label"
        ];

    }


    if (group === "bridges") {

        ids = [
            "bridge-line",
            "bridge-label"
        ];

    }


    ids.forEach(id => {

        if (map.getLayer(id)) {

            map.setLayoutProperty(
                id,
                "visibility",
                visibility
            );

        }

    });

}


/*
|--------------------------------------------------------------------------
| CLICK FEATURE
|--------------------------------------------------------------------------
*/

map.on("click", (event) => {

    const features =
        map.queryRenderedFeatures(
            event.point
        );


    if (!features.length) {

        return;

    }


    const feature =
        features.find(f => {

            return (
                f.properties &&
                (
                    f.properties.name ||
                    f.properties.ref ||
                    f.properties.highway
                )
            );

        });


    if (!feature) {

        return;

    }


    const properties =
        feature.properties || {};


    let html = "";


    if (properties.name) {

        html +=
            `<strong>${escapeHtml(properties.name)}</strong>`;

    }


    if (properties.highway) {

        html +=
            `<br>Loại: ${escapeHtml(properties.highway)}`;

    }


    if (properties.ref) {

        html +=
            `<br>Mã đường: ${escapeHtml(properties.ref)}`;

    }


    if (!html) {

        return;

    }


    new maplibregl.Popup()

        .setLngLat(event.lngLat)

        .setHTML(html)

        .addTo(map);

});


/*
|--------------------------------------------------------------------------
| ESCAPE HTML
|--------------------------------------------------------------------------
*/

function escapeHtml(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}

</script>


<script id="vietnam-vector-poi-icon-js">
/* VIETNAM_VECTOR_POI_ICON_UI_V1 */

(function () {
    "use strict";

    if (window.VietnamVectorPOIIconUI) return;
    window.VietnamVectorPOIIconUI = true;

    let allIcons = [];

    function esc(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function render(list) {

        const grid = document.getElementById(
            "vietnam-poi-icon-grid"
        );

        if (!grid) return;

        grid.innerHTML = "";

        list.forEach(function (name) {

            const button = document.createElement("button");

            button.type = "button";
            button.className = "vietnam-poi-icon-item";

            button.innerHTML = `
                <img
                    src="/icons/${encodeURIComponent(name)}.svg"
                    alt="${esc(name)}"
                    loading="lazy"
                >
                <div class="vietnam-poi-icon-name">
                    ${esc(name)}
                </div>
            `;

            button.addEventListener("click", function () {

                const url =
                    "/icons/" +
                    encodeURIComponent(name) +
                    ".svg";

                const preview =
                    document.getElementById(
                        "vietnam-poi-icon-preview"
                    );

                if (preview) {

                    preview.innerHTML = `
                        <img src="${url}" alt="${esc(name)}">
                        <div>
                            <strong>${esc(name)}</strong>
                            <div style="font-size:10px;color:#777">
                                ${esc(url)}
                            </div>
                        </div>
                    `;
                }

                window.dispatchEvent(
                    new CustomEvent(
                        "vietnam-poi-icon-selected",
                        {
                            detail: {
                                icon: name,
                                url: url
                            }
                        }
                    )
                );

                console.log(
                    "[Vietnam Vector] selected icon:",
                    name
                );
            });

            grid.appendChild(button);
        });
    }

    async function loadIcons() {

        const status =
            document.getElementById(
                "vietnam-poi-icon-status"
            );

        try {

            const response =
                await fetch("/api/icons", {
                    cache: "no-store"
                });

            if (!response.ok) {
                throw new Error(
                    "HTTP " + response.status
                );
            }

            const data = await response.json();

            allIcons = Array.from(
                new Set(
                    Object.values(
                        data.icons || {}
                    )
                )
            )
            .filter(Boolean)
            .sort();

            status.textContent =
                "Loaded " +
                allIcons.length +
                " POI icons";

            render(allIcons);

        } catch (error) {

            status.textContent =
                "Icon API error: " +
                error.message;
        }
    }

    function createPanel() {

        if (
            document.getElementById(
                "vietnam-poi-icon-panel"
            )
        ) {
            return;
        }

        const panel =
            document.createElement("div");

        panel.id =
            "vietnam-poi-icon-panel";

        panel.className =
            "vietnam-poi-icon-panel";

        panel.innerHTML = `
            <div class="vietnam-poi-icon-header">
                <span>POI Icons</span>
                <button
                    id="vietnam-poi-icon-close"
                    class="vietnam-poi-icon-close"
                >×</button>
            </div>

            <div class="vietnam-poi-icon-body">

                <div
                    id="vietnam-poi-icon-status"
                    class="vietnam-poi-icon-status"
                >
                    Loading...
                </div>

                <div
                    id="vietnam-poi-icon-preview"
                    class="vietnam-poi-icon-preview"
                >
                    <img src="/icons/poi_default.svg">
                    <div>
                        <strong>poi_default</strong>
                        <div style="font-size:10px;color:#777">
                            Default icon
                        </div>
                    </div>
                </div>

                <input
                    id="vietnam-poi-icon-search"
                    class="vietnam-poi-icon-search"
                    placeholder="Search restaurant, hotel, hospital..."
                >

                <div
                    id="vietnam-poi-icon-grid"
                    class="vietnam-poi-icon-grid"
                ></div>

            </div>
        `;

        document.body.appendChild(panel);

        document
            .getElementById("vietnam-poi-icon-close")
            .onclick = function () {
                panel.remove();
            };

        document
            .getElementById("vietnam-poi-icon-search")
            .addEventListener(
                "input",
                function () {

                    const q =
                        this.value
                            .trim()
                            .toLowerCase();

                    render(
                        q
                            ? allIcons.filter(
                                x =>
                                    x.toLowerCase()
                                     .includes(q)
                              )
                            : allIcons
                    );
                }
            );

        loadIcons();
    }

    window.openVietnamPOIIcons = createPanel;

    if (
        document.readyState === "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            createPanel
        );

    } else {

        createPanel();
    }

})();
</script>



<script id="vietnam-location-search-js">
(function () {

    "use strict";

    /*
     * ==========================================================
     * VIETNAM LOCATION SEARCH
     * ==========================================================
     */

    const locations = [

        {
            name: "Hồ Chí Minh",
            aliases: [
                "ho chi minh",
                "ho chi minh city",
                "tphcm",
                "tp hcm",
                "tp. hcm",
                "tp ho chi minh",
                "thanh pho ho chi minh",
                "sai gon",
                "saigon"
            ],
            detail: "Thành phố Hồ Chí Minh",
            center: [106.6297, 10.8231],
            zoom: 11,
            icon: "📍"
        },

        {
            name: "Hà Nội",
            aliases: [
                "ha noi",
                "hanoi",
                "thu do ha noi"
            ],
            detail: "Thủ đô Hà Nội",
            center: [105.8342, 21.0278],
            zoom: 11,
            icon: "📍"
        },

        {
            name: "Đà Nẵng",
            aliases: [
                "da nang",
                "danang",
                "tp da nang",
                "thanh pho da nang"
            ],
            detail: "Thành phố Đà Nẵng",
            center: [108.2022, 16.0544],
            zoom: 12,
            icon: "📍"
        },

        {
            name: "Hải Phòng",
            aliases: [
                "hai phong",
                "haiphong",
                "tp hai phong"
            ],
            detail: "Thành phố Hải Phòng",
            center: [106.6881, 20.8449],
            zoom: 11,
            icon: "📍"
        },

        {
            name: "Cần Thơ",
            aliases: [
                "can tho",
                "cantho",
                "tp can tho"
            ],
            detail: "Thành phố Cần Thơ",
            center: [105.7469, 10.0452],
            zoom: 11,
            icon: "📍"
        }

    ];

    function normalize(value) {

        return String(value || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .replace(/đ/g, "d")
            .replace(/[^a-z0-9\s]/g, " ")
            .replace(/\s+/g, " ")
            .trim();

    }

    function init() {

        const input =
            document.getElementById(
                "vietnam-location-search-input"
            );

        const clearButton =
            document.getElementById(
                "vietnam-location-search-clear"
            );

        const results =
            document.getElementById(
                "vietnam-location-search-results"
            );

        const container =
            document.getElementById(
                "vietnam-location-search"
            );

        if (!input || !clearButton || !results || !container) {

            console.error(
                "VIETNAM LOCATION SEARCH: DOM NOT FOUND"
            );

            return;

        }

        let activeIndex = -1;

        function hideResults() {

            results.innerHTML = "";
            results.style.display = "none";
            activeIndex = -1;

        }

        function showResults() {

            const query = normalize(input.value);

            results.innerHTML = "";
            activeIndex = -1;

            if (!query) {

                hideResults();
                return;

            }

            const matches = locations.filter(function (item) {

                const values = [
                    item.name,
                    item.detail,
                    ...(item.aliases || [])
                ];

                return values.some(function (value) {

                    return normalize(value).includes(query);

                });

            });

            if (!matches.length) {

                const empty =
                    document.createElement("div");

                empty.className =
                    "vietnam-location-search-empty";

                empty.textContent =
                    "Không tìm thấy địa điểm";

                results.appendChild(empty);

                results.style.display = "block";

                return;

            }

            matches.forEach(function (item, index) {

                const row =
                    document.createElement("div");

                row.className =
                    "vietnam-location-search-result";

                row.dataset.index = String(index);

                row.innerHTML =

                    '<div class="vietnam-location-search-result-icon">' +
                        item.icon +
                    '</div>' +

                    '<div class="vietnam-location-search-result-content">' +

                        '<div class="vietnam-location-search-result-name">' +
                            item.name +
                        '</div>' +

                        '<div class="vietnam-location-search-result-detail">' +
                            item.detail +
                        '</div>' +

                    '</div>';

                row.addEventListener("mousedown", function (event) {

                    event.preventDefault();

                });

                row.addEventListener("click", function () {

                    selectLocation(item);

                });

                results.appendChild(row);

            });

            results.style.display = "block";

        }

        function selectLocation(item) {

            if (
                typeof map === "undefined" ||
                !map ||
                typeof map.flyTo !== "function"
            ) {

                console.error(
                    "VIETNAM LOCATION SEARCH: map is not available"
                );

                return;

            }

            map.flyTo({

                center: item.center,

                zoom: item.zoom,

                speed: 1.2,

                curve: 1.4,

                essential: true

            });

            input.value = item.name;

            clearButton.style.display = "block";

            hideResults();

            if (typeof updateStatus === "function") {

                try {

                    updateStatus(
                        "Đã chọn: " + item.name
                    );

                } catch (e) {}

            }

            console.log(
                "LOCATION SEARCH: selected",
                item.name,
                item.center
            );

        }

        function moveActive(direction) {

            const rows =
                Array.from(
                    results.querySelectorAll(
                        ".vietnam-location-search-result"
                    )
                );

            if (!rows.length) {
                return;
            }

            activeIndex += direction;

            if (activeIndex < 0) {
                activeIndex = rows.length - 1;
            }

            if (activeIndex >= rows.length) {
                activeIndex = 0;
            }

            rows.forEach(function (row, index) {

                row.classList.toggle(
                    "active",
                    index === activeIndex
                );

            });

        }

        input.addEventListener("input", function () {

            clearButton.style.display =
                input.value.trim()
                    ? "block"
                    : "none";

            showResults();

        });

        input.addEventListener("focus", function () {

            if (input.value.trim()) {

                showResults();

            }

        });

        input.addEventListener("keydown", function (event) {

            if (event.key === "ArrowDown") {

                event.preventDefault();

                moveActive(1);

                return;

            }

            if (event.key === "ArrowUp") {

                event.preventDefault();

                moveActive(-1);

                return;

            }

            if (event.key === "Enter") {

                event.preventDefault();

                const rows =
                    Array.from(
                        results.querySelectorAll(
                            ".vietnam-location-search-result"
                        )
                    );

                if (
                    activeIndex >= 0 &&
                    rows[activeIndex]
                ) {

                    rows[activeIndex].click();
                    return;

                }

                const query =
                    normalize(input.value);

                const match =
                    locations.find(function (item) {

                        const values = [
                            item.name,
                            item.detail,
                            ...(item.aliases || [])
                        ];

                        return values.some(function (value) {

                            return normalize(value) === query;

                        });

                    });

                if (match) {

                    selectLocation(match);

                } else {

                    showResults();

                }

                return;

            }

            if (event.key === "Escape") {

                hideResults();

            }

        });

        clearButton.addEventListener("click", function () {

            input.value = "";

            clearButton.style.display = "none";

            hideResults();

            input.focus();

        });

        document.addEventListener("click", function (event) {

            if (!container.contains(event.target)) {

                hideResults();

            }

        });

        console.log(
            "VIETNAM LOCATION SEARCH: READY"
        );

    }

    if (document.readyState === "loading") {

        document.addEventListener(
            "DOMContentLoaded",
            init
        );

    } else {

        init();

    }

})();
</script>
